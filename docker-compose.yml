services:
  postgres:
    image: postgres:16-alpine
    container_name: meu-copiloto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-meucopiloto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meucopiloto}
      POSTGRES_DB: ${POSTGRES_DB:-meucopiloto}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-meucopiloto}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
